<div class="book-list-container">
  <div class="header">
    <h1>Book Station</h1>
    <div class="header-actions">
      <div class="search-box">
        <input
          type="text"
          [(ngModel)]="searchTitle"
          placeholder="Search by title..."
          (keyup.enter)="searchBooks()"
        />
        <button (click)="searchBooks()" class="btn-search">Search</button>
        <button *ngIf="searchTitle" (click)="onSearchClear()" class="btn-clear">Clear</button>
      </div>
      <a routerLink="/books/create" class="btn-add">+ Add Book</a>
      <button type="button" (click)="logout()" class="btn-logout">Logout</button>
    </div>
  </div>

  <div *ngIf="loading" class="loading">
    Loading...
  </div>

  <div *ngIf="!loading && books.length === 0" class="empty-state">
    <p>No books found. <a routerLink="/books/create">Add your first book</a></p>
  </div>

  <div *ngIf="!loading && books.length > 0" class="books-grid">
    <div *ngFor="let book of books" class="book-card">
      <h3>{{ book.title }}</h3>
      <p class="author">By: {{ book.author }}</p>
      <p *ngIf="book.year" class="year">Year: {{ book.year }}</p>
      <p class="description" [title]="book.description || ''">{{ book.description }}</p>
      <div class="actions">
        <a [routerLink]="['/books', book.id, 'edit']" class="btn-edit">Edit</a>
        <button (click)="deleteBook(book)" class="btn-delete">Delete</button>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && totalPages > 1" class="pagination">
    <button
      class="pagination-btn"
      [disabled]="currentPage === 0"
      (click)="goToPage(0)"
      title="First page">
      &laquo;
    </button>
    <button
      class="pagination-btn"
      [disabled]="currentPage === 0"
      (click)="goToPage(currentPage - 1)"
      title="Previous page">
      &lsaquo;
    </button>

    <span *ngFor="let page of pageNumbers" class="page-number">
      <button
        class="pagination-btn page-btn"
        [class.active]="currentPage === page"
        (click)="goToPage(page)">
        {{ page + 1 }}
      </button>
    </span>

    <button
      class="pagination-btn"
      [disabled]="currentPage >= totalPages - 1"
      (click)="goToPage(currentPage + 1)"
      title="Next page">
      &rsaquo;
    </button>
    <button
      class="pagination-btn"
      [disabled]="currentPage >= totalPages - 1"
      (click)="goToPage(totalPages - 1)"
      title="Last page">
      &raquo;
    </button>
  </div>

  <div *ngIf="!loading && totalElements > 0" class="pagination-info">
    Showing {{ getStartIndex() }} - {{ getEndIndex() }} of {{ totalElements }} books
  </div>
</div>
